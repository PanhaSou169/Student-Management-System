<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Management System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* FIX: the hidden attribute must win over display:grid on #login-view / #app-view */
[hidden]{display:none!important}
:root{
  --bg:#0f0f1e;--bg-2:#16162b;--card:#1a1a2e;--card-hover:#1f1f38;
  --border:#2a2a4a;--border-2:#3a3a5a;--text:#e2e8f0;--text-dim:#94a3b8;--muted:#64748b;
  --primary:#6366f1;--primary-2:#8b5cf6;--success:#10b981;--warning:#f59e0b;
  --danger:#ef4444;--info:#38bdf8;--radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
.hidden{display:none!important}
.input{width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 14px;color:var(--text);transition:border-color .15s}
.input:hover{border-color:var(--border-2)}
.input:focus{outline:none;border-color:var(--primary)}
select.input{cursor:pointer}
textarea.input{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all .15s;
  border:1px solid transparent;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(99,102,241,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--bg-2);border-color:var(--border);color:var(--text)}
.btn-secondary:hover{border-color:var(--border-2);background:var(--card-hover)}
.btn-danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fca5a5}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-block{width:100%;padding:11px 16px}
/* login */
#login-view{min-height:100vh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse at top,#1e1b4b 0%,#0f0f1e 60%)}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:40px 32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:22px;font-weight:700;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.login-logo p{color:var(--text-dim);font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:6px;
  font-weight:600;text-transform:uppercase;letter-spacing:.05em}
/* layout */
#app-view{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--bg-2);border-right:1px solid var(--border);padding:20px 0;
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-brand{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sidebar-brand h2{font-size:15px;font-weight:700;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sidebar-brand p{color:var(--muted);font-size:11px;margin-top:2px}
.nav-group-title{padding:8px 12px;font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:0 12px;
  border-radius:var(--radius-sm);color:var(--text-dim);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .15s;width:calc(100% - 24px);text-align:left}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:rgba(99,102,241,.12);color:#a5b4fc}
.sidebar-footer{margin-top:auto;padding:16px 0 0;border-top:1px solid var(--border)}
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:16px 28px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(15,15,30,.7);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px;font-weight:600}
.user-chip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;
  background:var(--card);border:1px solid var(--border);border-radius:999px;font-size:12px}
.avatar{width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.content{padding:28px;flex:1;overflow-y:auto}
/* content pieces */
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.card .subtitle,.subtitle{color:var(--text-dim);font-size:12px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.stat-card .label{color:var(--text-dim);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;font-weight:600}
.stat-card .value{font-size:26px;font-weight:700;margin-top:6px}
.stat-card .hint{color:var(--muted);font-size:11px;margin-top:4px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
table{width:100%;border-collapse:collapse;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{background:var(--bg-2);font-weight:600;color:var(--text-dim);font-size:11px;
  text-transform:uppercase;letter-spacing:.06em}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(99,102,241,.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.badge-admin{background:rgba(139,92,246,.15);color:#c4b5fd}
.badge-teacher{background:rgba(56,189,248,.15);color:#7dd3fc}
.badge-student{background:rgba(16,185,129,.15);color:#6ee7b7}
.badge-a{background:rgba(16,185,129,.15);color:#6ee7b7}
.badge-b{background:rgba(56,189,248,.15);color:#7dd3fc}
.badge-c{background:rgba(245,158,11,.15);color:#fcd34d}
.badge-d{background:rgba(251,146,60,.15);color:#fdba74}
.badge-e{background:rgba(239,68,68,.15);color:#fca5a5}
.badge-f{background:rgba(239,68,68,.25);color:#fca5a5}
.badge-pass{background:rgba(16,185,129,.15);color:#6ee7b7}
.badge-fail{background:rgba(239,68,68,.15);color:#fca5a5}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13px}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;
  min-width:28px;height:28px;padding:0 8px;border-radius:6px;
  background:var(--bg-2);border:1px solid var(--border);font-weight:700;font-size:12px}
.rank-badge.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#451a03;border:none}
.rank-badge.silver{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#1e293b;border:none}
.rank-badge.bronze{background:linear-gradient(135deg,#fbbf24,#d97706);color:#451a03;border:none}
.bar-wrap{background:var(--bg-2);border-radius:999px;height:6px;overflow:hidden;margin-top:6px}
.bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.transcript{font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:16px;font-size:12px;white-space:pre;overflow-x:auto;line-height:1.7}
[data-card]{transition:all .15s;cursor:pointer}
[data-card]:hover{border-color:var(--border-2);transform:translateY(-2px);background:var(--card-hover)}
/* modal */
#modal-root{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  display:none;place-items:center;z-index:100;padding:20px}
#modal-root.show{display:grid}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  width:100%;max-width:560px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;margin-bottom:4px}
.modal .subtitle{color:var(--text-dim);font-size:12px;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
/* toast */
#toast-root{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;
  gap:8px;z-index:200}
.toast{padding:12px 18px;border-radius:var(--radius-sm);background:var(--card);
  border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.35);
  font-size:13px;animation:slideIn .25s ease;min-width:240px;max-width:400px}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--info)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:800px){
  #app-view{grid-template-columns:1fr}
  .sidebar{display:none}
  .content{padding:16px}
  .topbar{padding:12px 16px}
}
</style>
</head>
<body>

<!-- ====================== LOGIN ====================== -->
<div id="login-view">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-logo">
      <h1>🎓 Student Management</h1>
      <p>Sign in to continue</p>
    </div>
    <div class="field">
      <label>User ID</label>
      <input class="input" id="login-id" required placeholder="A001">
    </div>
    <div class="field">
      <label>Password</label>
      <input class="input" type="password" id="login-password" required placeholder="••••••••">
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="login-btn">Sign in</button>
  </form>
</div>

<!-- ====================== APP ====================== -->
<div id="app-view" hidden>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>🎓 Student Management</h2>
      <p id="brand-sub">Dashboard</p>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" id="logout-btn">
        <span style="font-size:16px;width:18px;text-align:center">↪</span> Sign out
      </button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="user-chip">
        <div class="avatar" id="user-avatar">?</div>
        <span id="user-name">—</span>
        <span class="badge" id="user-role">—</span>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modal-root"><div class="modal" id="modal-content"></div></div>
<div id="toast-root"></div>

<!-- all logic lives in app.js (no inline script, so nothing is declared twice) -->
<script src="app.js"></script>
</body>
</html>
