<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Management System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f0f1e;--bg-2:#16162b;--card:#1a1a2e;--card-hover:#1f1f38;
  --border:#2a2a4a;--border-2:#3a3a5a;--text:#e2e8f0;--text-dim:#94a3b8;--muted:#64748b;
  --primary:#6366f1;--primary-2:#8b5cf6;--success:#10b981;--warning:#f59e0b;
  --danger:#ef4444;--info:#38bdf8;--radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
.hidden{display:none!important}
.input{width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 14px;color:var(--text);transition:border-color .15s}
.input:hover{border-color:var(--border-2)}
.input:focus{outline:none;border-color:var(--primary)}
select.input{cursor:pointer}
textarea.input{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all .15s;
  border:1px solid transparent;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(99,102,241,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--bg-2);border-color:var(--border);color:var(--text)}
.btn-secondary:hover{border-color:var(--border-2);background:var(--card-hover)}
.btn-danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fca5a5}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-block{width:100%;padding:11px 16px}
/* login */
#login-view{min-height:100vh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse at top,#1e1b4b 0%,#0f0f1e 60%)}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:40px 32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:22px;font-weight:700;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.login-logo p{color:var(--text-dim);font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:6px;
  font-weight:600;text-transform:uppercase;letter-spacing:.05em}
/* layout */
#app-view{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--bg-2);border-right:1px solid var(--border);padding:20px 0;
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-brand{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sidebar-brand h2{font-size:15px;font-weight:700;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sidebar-brand p{color:var(--muted);font-size:11px;margin-top:2px}
.nav-group-title{padding:8px 12px;font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:0 12px;
  border-radius:var(--radius-sm);color:var(--text-dim);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .15s;width:calc(100% - 24px);text-align:left}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:rgba(99,102,241,.12);color:#a5b4fc}
.sidebar-footer{margin-top:auto;padding:16px 0 0;border-top:1px solid var(--border)}
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:16px 28px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(15,15,30,.7);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px;font-weight:600}
.user-chip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;
  background:var(--card);border:1px solid var(--border);border-radius:999px;font-size:12px}
.avatar{width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.content{padding:28px;flex:1;overflow-y:auto}
/* content pieces */
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.card .subtitle{color:var(--text-dim);font-size:12px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.stat-card .label{color:var(--text-dim);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;font-weight:600}
.stat-card .value{font-size:26px;font-weight:700;margin-top:6px}
.stat-card .hint{color:var(--muted);font-size:11px;margin-top:4px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
table{width:100%;border-collapse:collapse;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{background:var(--bg-2);font-weight:600;color:var(--text-dim);font-size:11px;
  text-transform:uppercase;letter-spacing:.06em}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(99,102,241,.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.badge-admin{background:rgba(139,92,246,.15);color:#c4b5fd}
.badge-teacher{background:rgba(56,189,248,.15);color:#7dd3fc}
.badge-student{background:rgba(16,185,129,.15);color:#6ee7b7}
.badge-a{background:rgba(16,185,129,.15);color:#6ee7b7}
.badge-b{background:rgba(56,189,248,.15);color:#7dd3fc}
.badge-c{background:rgba(245,158,11,.15);color:#fcd34d}
.badge-d{background:rgba(251,146,60,.15);color:#fdba74}
.badge-e{background:rgba(239,68,68,.15);color:#fca5a5}
.badge-f{background:rgba(239,68,68,.25);color:#fca5a5}
.badge-pass{background:rgba(16,185,129,.15);color:#6ee7b7}
.badge-fail{background:rgba(239,68,68,.15);color:#fca5a5}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13px}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;
  min-width:28px;height:28px;padding:0 8px;border-radius:6px;
  background:var(--bg-2);border:1px solid var(--border);font-weight:700;font-size:12px}
.rank-badge.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#451a03;border:none}
.rank-badge.silver{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#1e293b;border:none}
.rank-badge.bronze{background:linear-gradient(135deg,#fbbf24,#d97706);color:#451a03;border:none}
.bar-wrap{background:var(--bg-2);border-radius:999px;height:6px;overflow:hidden;margin-top:6px}
.bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.transcript{font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:16px;font-size:12px;white-space:pre;overflow-x:auto;line-height:1.7}
[data-card]{transition:all .15s;cursor:pointer}
[data-card]:hover{border-color:var(--border-2);transform:translateY(-2px);background:var(--card-hover)}
/* modal */
#modal-root{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  display:none;place-items:center;z-index:100;padding:20px}
#modal-root.show{display:grid}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  width:100%;max-width:560px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;margin-bottom:4px}
.modal .subtitle{color:var(--text-dim);font-size:12px;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
/* toast */
#toast-root{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;
  gap:8px;z-index:200}
.toast{padding:12px 18px;border-radius:var(--radius-sm);background:var(--card);
  border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.35);
  font-size:13px;animation:slideIn .25s ease;min-width:240px;max-width:400px}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--info)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:800px){
  #app-view{grid-template-columns:1fr}
  .sidebar{display:none}
  .content{padding:16px}
  .topbar{padding:12px 16px}
}
</style>
</head>
<body>

<!-- ====================== LOGIN ====================== -->
<div id="login-view">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-logo">
      <h1>🎓 Student Management</h1>
      <p>Sign in to continue</p>
    </div>
    <div class="field">
      <label>User ID</label>
      <input class="input" id="login-id" required placeholder="A001">
    </div>
    <div class="field">
      <label>Password</label>
      <input class="input" type="password" id="login-password" required placeholder="••••••••">
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="login-btn">Sign in</button>
  </form>
</div>

<!-- ====================== APP ====================== -->
<div id="app-view" hidden>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>🎓 Student Management</h2>
      <p id="brand-sub">Dashboard</p>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" id="logout-btn">
        <span style="font-size:16px;width:18px;text-align:center">↪</span> Sign out
      </button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="user-chip">
        <div class="avatar" id="user-avatar">?</div>
        <span id="user-name">—</span>
        <span class="badge" id="user-role">—</span>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modal-root"><div class="modal" id="modal-content"></div></div>
<div id="toast-root"></div>

<script>
/* ================================================================
   1. Supabase
   ================================================================ */
const SUPABASE_URL = 'https://frotwvjkuriejaluvjvp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyb3R3dmprdXJpZWphbHV2anZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MzI3NjgsImV4cCI6MjEwOTIwODc2OH0.VBADQtaxalwttX3i6noXxh9l0_v1g2yvYZ_pEp_T208';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================================================================
   2. State + helpers
   ================================================================ */
let currentUser = null;
let currentView = 'dashboard';
const cache = { users: null, subjects: null, components: null };

const PASS_MARK = 50;
const HONOR_ROLL_MIN = 85;

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toast-root').append(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s,transform .3s';
    el.style.opacity = '0'; el.style.transform = 'translateX(20px)';
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

function openModal(html, actions) {
  $('#modal-content').innerHTML = html + '<div class="modal-actions" id="modal-actions"></div>';
  const bar = $('#modal-actions');
  for (const a of actions) {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.primary ? 'btn-primary' : a.danger ? 'btn-danger' : 'btn-secondary');
    b.textContent = a.label;
    b.onclick = a.onClick;
    bar.append(b);
  }
  const root = $('#modal-root');
  root.classList.add('show');
  root.onclick = e => { if (e.target === root) closeModal(); };
}
function closeModal() { $('#modal-root').classList.remove('show'); }

function cacheClear() { cache.users = cache.subjects = cache.components = null; }

/* ================================================================
   3. Grade rules
   ================================================================ */
function letter(score) {
  if (score >= 90) return 'A';
  if (score >= 80) return 'B';
  if (score >= 70) return 'C';
  if (score >= 60) return 'D';
  if (score >= PASS_MARK) return 'E';
  return 'F';
}
function isPass(score) { return score >= PASS_MARK; }
function gpaPoints(l) {
  return { A: 4.0, B: 3.0, C: 2.0, D: 1.0, E: 0.5, F: 0.0 }[l] || 0;
}
function weightedAvg(components) {
  let w = 0, total = 0;
  for (const c of components) { total += Number(c.score) * Number(c.weight); w += Number(c.weight); }
  return w === 0 ? 0 : total / w;
}
function creditGpa(grades) {
  let c = 0, p = 0;
  for (const g of grades) { c += Number(g.credits); p += g.gpaPoints * Number(g.credits); }
  return c === 0 ? 0 : p / c;
}

/* ================================================================
   4. Data loaders (with tiny cache)
   ================================================================ */
async function loadUsers() {
  if (cache.users) return cache.users;
  const { data, error } = await sb.from('users').select('*').order('id');
  if (error) throw error;
  return (cache.users = data);
}
async function loadSubjects() {
  if (cache.subjects) return cache.subjects;
  const { data, error } = await sb.from('subjects').select('*').order('name');
  if (error) throw error;
  return (cache.subjects = data);
}
async function loadAllComponents() {
  if (cache.components) return cache.components;
  const { data, error } = await sb.from('grade_components')
    .select('*').order('student_id').order('subject').order('component_name');
  if (error) throw error;
  return (cache.components = data);
}
async function loadComponentsFor(studentId) {
  const { data, error } = await sb.from('grade_components')
    .select('*').eq('student_id', studentId)
    .order('subject').order('component_name');
  if (error) throw error;
  return data;
}

/** Returns aggregated SubjectGrade[] for one student. */
async function computeSubjectGrades(studentId) {
  const [comps, subjects] = await Promise.all([
    loadComponentsFor(studentId),
    loadSubjects(),
  ]);
  const bySubject = {};
  for (const c of comps) (bySubject[c.subject] ||= []).push(c);
  const creditsOf = name => {
    const s = subjects.find(x => x.name === name);
    return s ? Number(s.credits) : 1;
  };
  return Object.entries(bySubject).map(([subject, list]) => {
    const score = weightedAvg(list);
    const l = letter(score);
    return {
      subject, score, letter: l,
      result: isPass(score) ? 'Pass' : 'Fail',
      credits: creditsOf(subject),
      gpaPoints: gpaPoints(l),
      componentCount: list.length,
      components: list,
    };
  }).sort((a, b) => a.subject.localeCompare(b.subject));
}

/** Full leaderboard across all students. viewer filters by subject for teachers. */
async function computeLeaderboard(viewer) {
  const users = await loadUsers();
  const students = users.filter(u => u.role === 'STUDENT');
  const rows = [];
  for (const s of students) {
    const grades = await computeSubjectGrades(s.id);
    const visible = viewer && viewer.role === 'TEACHER'
      ? grades.filter(g => g.subject.toLowerCase() === (viewer.subject || '').toLowerCase())
      : grades;
    if (visible.length === 0) continue;
    const avg = visible.reduce((a, g) => a + g.score, 0) / visible.length;
    const gpa = creditGpa(visible);
    rows.push({
      studentId: s.id, name: s.name,
      average: avg, gpa, subjectCount: visible.length,
    });
  }
  rows.sort((a, b) => b.average - a.average || a.name.localeCompare(b.name));
  let rank = 0; let prevAvg = NaN;
  return rows.map((r, i) => {
    if (i === 0 || r.average !== prevAvg) rank = i + 1;
    prevAvg = r.average;
    return { rank, ...r };
  });
}

/* ================================================================
   5. Audit logging
   ================================================================ */
async function log(action, details) {
  try {
    await sb.from('audit_log').insert([{
      actor: currentUser ? currentUser.id : '-',
      action, details,
    }]);
  } catch (e) { console.warn('Audit log failed:', e); }
}

/* ================================================================
   6. Login / logout
   ================================================================ */
$('#login-form').onsubmit = async e => {
  e.preventDefault();
  const btn = $('#login-btn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const id = $('#login-id').value.trim();
    const password = $('#login-password').value;
    const { data, error } = await sb.from('users').select('*')
      .eq('id', id).eq('password', password).single();
    if (error || !data) throw new Error('Invalid ID or password');
    currentUser = data;
    enterApp();
  } catch (err) {
    toast(err.message || 'Login failed', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
};

function logout() {
  currentUser = null;
  cacheClear();
  $('#app-view').hidden = true;
  $('#login-view').hidden = false;
  $('#login-form').reset();
}
$('#logout-btn').onclick = logout;

/* ================================================================
   7. Navigation
   ================================================================ */
function navFor(role) {
  if (role === 'ADMIN') return [
    { id:'dashboard', icon:'◉', label:'Dashboard' },
    { group:'Users' },
    { id:'users', icon:'👥', label:'Users' },
    { id:'subjects', icon:'📚', label:'Subjects' },
    { group:'Grades' },
    { id:'students', icon:'🎒', label:'Students' },
    { id:'leaderboard', icon:'🏆', label:'Leaderboard' },
    { id:'honor-roll', icon:'⭐', label:'Honor Roll' },
    { id:'failing', icon:'⚠', label:'Failing' },
    { id:'stats', icon:'📊', label:'Class Stats' },
    { group:'Admin' },
    { id:'audit', icon:'📋', label:'Audit Log' },
    { id:'settings', icon:'⚙', label:'Settings' },
  ];
  if (role === 'TEACHER') return [
    { id:'dashboard', icon:'◉', label:'Dashboard' },
    { id:'students', icon:'🎒', label:'Students' },
    { id:'leaderboard', icon:'🏆', label:'Leaderboard' },
    { id:'stats', icon:'📊', label:'Class Stats' },
    { id:'settings', icon:'⚙', label:'Settings' },
  ];
  return [
    { id:'dashboard', icon:'◉', label:'Dashboard' },
    { id:'my-grades', icon:'📝', label:'My Grades' },
    { id:'top', icon:'🏆', label:'Top 5' },
    { id:'settings', icon:'⚙', label:'Settings' },
  ];
}

function renderNav() {
  const nav = $('#nav');
  nav.innerHTML = '';
  for (const item of navFor(currentUser.role)) {
    if (item.group) {
      const t = document.createElement('div');
      t.className = 'nav-group-title'; t.textContent = item.group;
      nav.append(t); continue;
    }
    const b = document.createElement('button');
    b.className = 'nav-item';
    b.dataset.view = item.id;
    b.innerHTML = `<span style="font-size:16px;width:18px;text-align:center">${item.icon}</span><span>${item.label}</span>`;
    b.onclick = () => { currentView = item.id; render(); };
    nav.append(b);
  }
}

function enterApp() {
  $('#login-view').hidden = true;
  $('#app-view').hidden = false;
  $('#user-name').textContent = currentUser.name;
  $('#user-role').textContent = currentUser.role;
  $('#user-role').className = 'badge badge-' + currentUser.role.toLowerCase();
  $('#user-avatar').textContent = (currentUser.name || '?').charAt(0).toUpperCase();
  renderNav();
  currentView = 'dashboard';
  render();
}

/* ================================================================
   8. Render dispatcher
   ================================================================ */
async function render() {
  const el = $('#content');
  el.innerHTML = '<div class="empty">Loading…</div>';
  const item = navFor(currentUser.role).find(n => n.id === currentView) || { label:'Dashboard' };
  $('#page-title').textContent = item.label;
  $('#brand-sub').textContent = item.label;
  $$('.nav-item[data-view]').forEach(n => n.classList.toggle('active', n.dataset.view === currentView));
  try {
    if (views[currentView]) await views[currentView](el);
    else el.innerHTML = '<div class="empty">Unknown view.</div>';
  } catch (err) {
    el.innerHTML = `<div class="empty">⚠ ${esc(err.message)}</div>`;
  }
}

   ================================================================ */
function leaderTable(rows) {
  if (!rows.length) return '<div class="empty">No data.</div>';
  return `<table>
    <thead><tr><th>#</th><th>Student</th><th>Average</th><th>GPA</th><th>Subjects</th></tr></thead>
    <tbody>${rows.map(r => {
      const c = r.rank === 1 ? 'gold' : r.rank === 2 ? 'silver' : r.rank === 3 ? 'bronze' : '';
      return `<tr>
        <td><span class="rank-badge ${c}">${r.rank}</span></td>
        <td><strong>${esc(r.name)}</strong><br><span class="subtitle">${esc(r.studentId)}</span></td>
        <td>${r.average.toFixed(2)}</td>
        <td>${r.gpa.toFixed(2)}</td>
        <td>${r.subjectCount}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function subjectGradeTable(grades) {
  if (!grades.length) return '<div class="empty">No grades.</div>';
  return `<table>
    <thead><tr><th>Subject</th><th>Score</th><th>Letter</th><th>Credits</th><th>Result</th></tr></thead>
    <tbody>${grades.map(g => `
      <tr>
        <td><strong>${esc(g.subject)}</strong></td>
        <td>${g.score.toFixed(1)}</td>
        <td><span class="badge badge-${g.letter.toLowerCase()}">${g.letter}</span></td>
        <td>${g.credits}</td>
        <td><span class="badge badge-${g.result.toLowerCase()}">${g.result}</span></td>
      </tr>`).join('')}</tbody>
  </table>`;
}

function componentTable(comps, interactive = false, onEdit, onDelete) {
  if (!comps.length) return '<div class="empty">No components.</div>';
  return `<table>
    <thead><tr><th>Subject</th><th>Component</th><th>Score</th><th>Weight</th>
      <th>By</th>${interactive ? '<th></th>' : ''}</tr></thead>
    <tbody>${comps.map(c => `
      <tr>
        <td>${esc(c.subject)}</td>
        <td>${esc(c.component_name)}</td>
        <td>${Number(c.score).toFixed(1)}</td>
        <td>${Number(c.weight).toFixed(1)}</td>
        <td>${esc(c.graded_by || '—')}</td>
        ${interactive ? `<td>
          <div class="row-actions">
            <button class="btn btn-secondary btn-sm" data-edit="${esc(c.id)}">Edit</button>
            <button class="btn btn-danger btn-sm" data-del="${esc(c.id)}">Del</button>
          </div>
        </td>` : ''}
      </tr>`).join('')}</tbody>
  </table>`;
}

function statCard(label, value, hint) {
  return `<div class="stat-card">
    <div class="label">${esc(label)}</div>
    <div class="value">${esc(String(value))}</div>
    ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
  </div>`;
}

function statsTable(stats) {
  if (!stats.length) return '<div class="empty">No data.</div>';
  return `<table>
    <thead><tr><th>Subject</th><th>N</th><th>Avg</th><th>Median</th>
      <th>Std</th><th>Min</th><th>Max</th><th>Pass%</th></tr></thead>
    <tbody>${stats.map(s => {
      const c = s.passRate >= 80 ? 'linear-gradient(90deg,#10b981,#34d399)'
              : s.passRate >= 50 ? 'linear-gradient(90deg,#f59e0b,#fbbf24)'
              : 'linear-gradient(90deg,#ef4444,#f87171)';
      return `<tr>
        <td><strong>${esc(s.subject)}</strong></td>
        <td>${s.count}</td>
        <td>${s.average.toFixed(2)}</td>
        <td>${s.median.toFixed(2)}</td>
        <td>${s.stdDev.toFixed(2)}</td>
        <td>${s.min.toFixed(1)}</td>
        <td>${s.max.toFixed(1)}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <span>${s.passRate.toFixed(1)}%</span>
            <div class="bar-wrap" style="flex:1;min-width:60px">
              <div class="bar" style="width:${s.passRate}%;background:${c}"></div>
            </div>
          </div>
        </td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

async function nextUserId(prefix) {
  const { data } = await sb.from('users').select('id')
    .like('id', prefix + '%').order('id', { ascending: false }).limit(1);
  if (!data || data.length === 0) return prefix + '001';
  const n = parseInt(data[0].id.slice(1), 10) + 1;
  return prefix + String(n).padStart(3, '0');
}

function addUser() {
  openModal(`
    <h2>New user</h2>
    <p class="subtitle">Create an account</p>
    <div class="field"><label>Role</label>
      <select class="input" id="f-role">
        <option value="STUDENT">Student</option>

      <input class="input" type="password" id="f-password"></div>
  `, [
    { label: 'Cancel', onClick: closeModal },
    { label: 'Create', primary: true, onClick: async () => {
        try {
          const role = $('#f-role').value;
          const name = $('#f-name').value.trim();
          const subject = role === 'TEACHER' ? $('#f-subject').value.trim() : null;
          const password = $('#f-password').value;

          const prefix = role[0];

          const { error } = await sb.from('users').insert([{ id, name, role, subject, password }]);
          if (error) throw error;
          await log('ADD_USER', `${id} ${role} ${name}`);
          cacheClear();

async function openStudent(id) {
  const me = currentUser;
  const [grades, comps, leader] = await Promise.all([
    computeSubjectGrades(id),
    loadComponentsFor(id),
    computeLeaderboard(me.role === 'TEACHER' ? me : null),
  ]);
  const rank = leader.find(r => r.studentId === id);

  // Filter components visible to teacher
  const visibleComps = me.role === 'TEACHER'
    ? comps.filter(c => c.subject.toLowerCase() === (me.subject || '').toLowerCase())
    : comps;
  const visibleGrades = me.role === 'TEACHER'
    ? grades.filter(g => g.subject.toLowerCase() === (me.subject || '').toLowerCase())
    : grades;

  const transcript = buildTranscript(id, visibleGrades);

  openModal(`
    <h2>${esc(id)}</h2>
    <p class="subtitle">${rank
      ? `Rank #${rank.rank} · GPA ${rank.gpa.toFixed(2)} · avg ${rank.average.toFixed(1)}`
      : 'No grades yet'}</p>
    <h3 style="font-size:14px;margin:16px 0 8px">Subject grades</h3>
    ${subjectGradeTable(visibleGrades)}
    <h3 style="font-size:14px;margin:20px 0 8px">Grade components</h3>
    <div id="modal-comps">${componentTable(visibleComps, true)}</div>
    <h3 style="font-size:14px;margin:20px 0 8px">Transcript</h3>
    <pre class="transcript">${esc(transcript)}</pre>
  `, [
    { label: 'Close', onClick: closeModal },
    { label: '+ Add component', primary: true, onClick: () => addComponent(id) },
  ]);

  const mc = $('#modal-content');
  mc.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const comp = visibleComps.find(c => String(c.id) === b.dataset.edit);
    if (comp) editComponent(id, comp);
  });
  mc.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const comp = visibleComps.find(c => String(c.id) === b.dataset.del);
    if (!comp) return;
    if (!confirm(`Delete ${comp.subject} / ${comp.component_name}?`)) return;
    try {
      const { error } = await sb.from('grade_components').delete().eq('id', comp.id);
      if (error) throw error;
      await log('DELETE_COMPONENT', `${id} ${comp.subject}/${comp.component_name}`);
      cacheClear(); toast('Deleted', 'success');
      openStudent(id);
    } catch (err) { toast(err.message, 'error'); }
  });
}

function buildTranscript(studentId, grades) {
  const lines = [];
  lines.push('=============================================');
  lines.push(' TRANSCRIPT — ' + studentId);
  lines.push('=============================================');
  if (!grades.length) { lines.push(' No grades on record.'); return lines.join('\n'); }
  lines.push(pad('Subject', 20) + pad('Score', 7) + pad('Ltr', 5) + pad('Cr', 5) + 'GPA');
  let creditsSum = 0, pointsSum = 0, scoreSum = 0;
  for (const g of grades) {
    lines.push(pad(g.subject, 20)
      + pad(g.score.toFixed(1), 7)
      + pad(g.letter, 5)
      + pad(String(g.credits), 5)
      + g.gpaPoints.toFixed(2));
    creditsSum += Number(g.credits);
    pointsSum += g.gpaPoints * Number(g.credits);
    scoreSum += g.score;
  }
  const avg = scoreSum / grades.length;
  const gpa = creditsSum === 0 ? 0 : pointsSum / creditsSum;
  lines.push('---------------------------------------------');
  lines.push(` Average: ${avg.toFixed(2)}    GPA: ${gpa.toFixed(2)}    Credits: ${creditsSum.toFixed(1)}`);
  return lines.join('\n');
}
function pad(s, n) { s = String(s); return s.length >= n ? s : s + ' '.repeat(n - s.length); }

function addComponent(studentId) {
  const lockedSubject = currentUser.role === 'TEACHER' ? currentUser.subject : null;
  openModal(`
    <h2>Add component</h2>
    <p class="subtitle">Student ${esc(studentId)}</p>
    <div class="field"><label>Subject</label>
      ${lockedSubject
        ? `<input class="input" value="${esc(lockedSubject)}" readonly>`
        : `<input class="input" id="c-subject" placeholder="Math">`}
    </div>
    <div class="field"><label>Component name</label>
      <input class="input" id="c-name" placeholder="Quiz 1 / Midterm / Final"></div>
    <div class="grid grid-2" style="gap:12px">
      <div class="field"><label>Score (0-100)</label>
        <input class="input" type="number" min="0" max="100" step="0.1" id="c-score"></div>
      <div class="field"><label>Weight</label>
        <input class="input" type="number" min="0.1" step="0.1" id="c-weight" value="1"></div>
    </div>
    <div class="field"><label>Comment (optional)</label>
      <input class="input" id="c-comment"></div>
  `, [
    { label: 'Cancel', onClick: closeModal },
    { label: 'Add', primary: true, onClick: async () => {
        try {
          const subject = lockedSubject || $('#c-subject').value.trim();
          const component_name = $('#c-name').value.trim();
          const score = parseFloat($('#c-score').value);
          const weight = parseFloat($('#c-weight').value);
          const comment = $('#c-comment').value.trim() || null;
          if (!subject || !component_name) throw new Error('Subject and name required');
          if (!(score >= 0 && score <= 100)) throw new Error('Score must be 0–100');
          if (!(weight > 0)) throw new Error('Weight must be > 0');
          // ensure subject exists
          const subs = await loadSubjects();
          if (!subs.find(s => s.name.toLowerCase() === subject.toLowerCase())) {
            await sb.from('subjects').insert([{ name: subject, credits: 1.0 }]);
          }
          const { error } = await sb.from('grade_components').insert([{
            student_id: studentId, subject, component_name, score, weight,
            graded_by: currentUser.id, comment,
            updated_at: Date.now(),
          }]);
          if (error) throw error;
          await log('ADD_COMPONENT',
            `${studentId} ${subject}/${component_name} = ${score}`);
          cacheClear(); closeModal(); toast('Component added', 'success');
          openStudent(studentId);
        } catch (err) { toast(err.message, 'error'); }
      }},
  ]);
}

function editComponent(studentId, comp) {
  openModal(`
    <h2>Edit component</h2>
    <p class="subtitle">${esc(comp.subject)} / ${esc(comp.component_name)}</p>
    <div class="grid grid-2" style="gap:12px">
      <div class="field"><label>Score</label>
        <input class="input" type="number" step="0.1" id="e-score" value="${comp.score}"></div>
      <div class="field"><label>Weight</label>
        <input class="input" type="number" step="0.1" id="e-weight" value="${comp.weight}"></div>
    </div>
    <div class="field"><label>Comment</label>
      <input class="input" id="e-comment" value="${esc(comp.comment || '')}"></div>
  `, [
    { label: 'Cancel', onClick: closeModal },
    { label: 'Save', primary: true, onClick: async () => {
        try {
          const score = parseFloat($('#e-score').value);
          const weight = parseFloat($('#e-weight').value);
          const comment = $('#e-comment').value.trim() || null;
          const { error } = await sb.from('grade_components').update({
            score, weight, comment, graded_by: currentUser.id, updated_at: Date.now(),
          }).eq('id', comp.id);
          if (error) throw error;
          await log('UPDATE_COMPONENT',
            `${studentId} ${comp.subject}/${comp.component_name} = ${score}`);
          cacheClear(); closeModal(); toast('Updated', 'success');
          openStudent(studentId);
        } catch (err) { toast(err.message, 'error'); }
      }},
  ]);
}

/* -------- Class statistics -------- */
async function computeStats(viewer) {
  const users = await loadUsers();
  const students = users.filter(u => u.role === 'STUDENT');
  const bySubject = {};
  for (const s of students) {
    const grades = await computeSubjectGrades(s.id);
    for (const g of grades) {
      if (viewer && viewer.role === 'TEACHER'
          && g.subject.toLowerCase() !== (viewer.subject || '').toLowerCase()) continue;
      (bySubject[g.subject] ||= []).push(g.score);
    }
  }
  const result = [];
  for (const [subject, scores] of Object.entries(bySubject)) {
    scores.sort((a, b) => a - b);
    const n = scores.length;
    const avg = scores.reduce((a, b) => a + b, 0) / n;
    const median = n % 2 === 0
      ? (scores[n/2 - 1] + scores[n/2]) / 2
      : scores[Math.floor(n/2)];
    const variance = scores.reduce((a, s) => a + (s - avg) ** 2, 0) / n;
    const stdDev = Math.sqrt(variance);
    const min = scores[0];
    const max = scores[n - 1];
    const passed = scores.filter(s => isPass(s)).length;
    const passRate = passed / n * 100;
    result.push({ subject, count: n, average: avg, median, stdDev, min, max, passed, passRate });
  }
  result.sort((a, b) => a.subject.localeCompare(b.subject));
  return result;
}

views.stats = async function(el) {
  const stats = await computeStats(currentUser);
  el.innerHTML = `<div class="card">
    <h3>📊 Class statistics</h3>
    <p class="subtitle">Per subject · median · std-dev · pass rate</p>
    <div style="margin-top:12px">${statsTable(stats)}</div>
  </div>`;
};

/* -------- Settings (change own password) -------- */
views.settings = async function(el) {
  el.innerHTML = `
    <div class="card" style="max-width:520px">
      <h3>⚙ Account</h3>
      <p class="subtitle">Update your password</p>
      <div style="margin-top:16px">
        <div class="field"><label>Current password</label>
          <input class="input" type="password" id="pw-old"></div>
        <div class="field"><label>New password</label>
          <input class="input" type="password" id="pw-new"></div>
        <div class="field"><label>Confirm new password</label>
          <input class="input" type="password" id="pw-confirm"></div>
        <button class="btn btn-primary btn-block" id="pw-save">Update password</button>
      </div>
    </div>`;
  $('#pw-save').onclick = async () => {
    try {
      const old = $('#pw-old').value;
      const nw = $('#pw-new').value;
      if (old !== currentUser.password) throw new Error('Current password is wrong');
      if (nw.length < 6) throw new Error('New password must be at least 6 characters');
      if (nw !== $('#pw-confirm').value) throw new Error('Passwords do not match');
      const { error } = await sb.from('users').update({ password: nw }).eq('id', currentUser.id);
      if (error) throw error;
      currentUser.password = nw;
      await log('CHANGE_PASSWORD', 'own password');
      toast('Password updated', 'success');
      $('#pw-old').value = $('#pw-new').value = $('#pw-confirm').value = '';
    } catch (err) { toast(err.message, 'error'); }
  };
};
