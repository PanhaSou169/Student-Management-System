services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: student_db
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_general_ci"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      SMS_DB_URL: "jdbc:mysql://db:3306/"
      SMS_DB_NAME: "student_db"
      SMS_DB_USER: "root"
      SMS_DB_PASSWORD: "rootpass"
      SMS_ADMIN_PASSWORD: "Admin12345"
      SMS_ADMIN_NAME: "Administrator"
      SMS_DATA_DIR: "/app/data"
      SMS_LOG_REQUESTS: "true"
      TZ: "UTC"
    ports:
      - "8080:8080"
    volumes:
      - csv_data:/app/data

volumes:
  db_data:
  csv_data: